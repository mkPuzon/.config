"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = "$os$hostname$directory$git_branch$git_status$python$docker_context$nodejs $character"

[os]
disabled = false
format = "[$symbol](#blue) "

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
format = '[$user ]($style)'

[hostname]
ssh_only = false
format = ""
disabled = true

[directory]
home_symbol = "/home/cadell"
format            = "[$path](cyan) "
truncation_length = 4

[git_branch]
symbol = ""
format = "[$symbol $branch](bold purple) "

[git_status]
format     = "($ahead_behind$staged$modified$untracked$deleted$conflicted)"
ahead      = "[⇡$count ](bold cyan)"
behind     = "[⇣$count ](bold cyan)"
diverged   = "[⇡$ahead_count⇣$behind_count ](bold cyan)"
staged     = "[+$count ](bold green)"
modified   = "[●$count ](bold yellow)"
untracked  = "[?$count ](bold white)"
deleted    = "[✘$count ](bold red)"
conflicted = "[⚡$count ](bold red)"

[nodejs]
symbol = ""
format = "[$symbol $version](green) "

[python]
symbol = ""
format = "[$symbol $version( \\($virtualenv\\))](bold yellow) "
detect_extensions = ["py"]
detect_files = ["pyproject.toml", "requirements.txt", ".python-version", "setup.py"]

[docker_context]
symbol = ""
format = "[$symbol $context](bold blue) "
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]

[character]
success_symbol = "[❯](green)"
error_symbol   = "[❯](red)"
vimcmd_symbol  = "[❮](blue)"
