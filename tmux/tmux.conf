# basic settings
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g set-clipboard on

# change prefix key to Ctrl+a
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# easier pane splitting
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# source file
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# switch panes without prefix
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# start numbering at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# alt+number to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# vim-style copying
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# style status bar -- catppuccin mocha
thm_base="#1e1e2e"
thm_mantle="#181825"
thm_crust="#11111b"

thm_text="#cdd6f4"
thm_subtext0="#a6adc8"
thm_overlay0="#6c7086"
thm_surface0="#313244"
thm_surface1="#45475a"
thm_surface2="#585b70"

thm_blue="#89b4fa"
thm_sky="#89dceb"
thm_green="#a6e3a1"
thm_yellow="#f9e2af"
thm_red="#f38ba8"
thm_mauve="#cba6f7"
thm_pink="#f5c2e7"
thm_peach="#fab387"
thm_lavender="#b4befe"

set -g status "on"
set -g status-bg "${thm_base}"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

# messages
set -g message-style "fg=${thm_text},bg=${thm_surface0},align=centre"
set -g message-command-style "fg=${thm_text},bg=${thm_surface0},align=centre"

# panes
set -g pane-border-style "fg=${thm_surface1}"
set -g pane-active-border-style "fg=${thm_blue}"

# windows
set -g window-status-style "fg=${thm_subtext0},bg=${thm_base},none"
set -g window-status-separator ""
set -g window-status-activity-style "fg=${thm_yellow},bg=${thm_base},none"

# statusline - current window
set -g window-status-current-format "\
#[fg=${thm_blue},bg=${thm_base}] #I: \
#[fg=${thm_green},bg=${thm_base}]#(echo '#{pane_current_path}' | rev | cut -d'/' -f-2 | rev) \
#[fg=${thm_subtext0},bg=${thm_base}]"

# statusline - other windows
set -g window-status-format "\
#[fg=${thm_subtext0},bg=${thm_base}] #I: \
#[fg=${thm_text},bg=${thm_base}]#W"

set -g status-left "#[fg=${thm_mauve},bg=${thm_base},bold]#{session_name} "
