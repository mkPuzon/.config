[general]
import = ["~/.config/alacritty/themes/catppuccin-mocha.toml"]
live_config_reload = true

[window]
decorations = "None"

[terminal.shell]
program="/usr/bin/zsh"

[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[window.padding]
x = 8 
y = 8 

[keyboard]
bindings = [
   { key = "c", mods = "Control", action = "Copy" },
   { key = "v", mods = "Control", action = "Paste" }
]
